- id: Q8
  question: How much funeral cover is provided for a member's 4-year-old child?
  outcome: answered
  answer: 'A member''s child aged under 6 is covered for R7 500 in funeral cover, so a 4-year-old child
    would be covered for R7 500. (For comparison, a child aged 6 to 21, or up to 25 if a full-time student,
    is covered for R15 000.)


