- id: Q1
  question: What is the maximum lump sum group life cover a member can have?
  outcome: answered
  answer: 'The maximum lump sum group life cover per member is R25 000 000. This applies regardless of
    the member''s salary or the cover multiple the employer chose (multiples run from 1x to 5x annual
    pensionable salary).


    Don''t confuse this with the free cover limit: members are covered without medical evidence only up
    to the free cover limit, which depends on the number of members in the scheme (for example R1 000
    000 for 10–49 members up to R10 000 000 for 1 000 or more members). Cover above the free cover limit
    is subject to underwriting, and schemes with fewer than 10 members are fully underwritten with no
    free cover limit.'
