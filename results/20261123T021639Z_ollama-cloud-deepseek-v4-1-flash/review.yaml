- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would get a monthly benefit of R42 500. That
    is 100% of the first R20 000 of monthly salary plus 75% of the remaining R30 000, and it is below
    the R300 000 maximum monthly benefit, so no cap applies. Option C also has a 3-month waiting period
    and a fixed 5% annual escalation. "Salary" here means the member''s monthly pensionable salary at
    the date the disability started, and the employer selects the option for each category of members
    — so check that the member''s category is actually on Option C. This is the general rule applied to
    your example figure; the claims team decides individual claims.


    Caveats: The R42 500 applies only if the member''s category is on Option C; the employer chooses the
    option per category of members. The example uses a salary of R50 000 a month; the actual benefit uses
    monthly pensionable salary at the date disability started.'
