- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a group disability income claim the Kestrel Claims FAQ lists these documents:

    - A completed Kestrel disability claim form, with both the employer section and the member section
    filled in

    - A medical report from the treating doctor

    - The member''s last 3 payslips

    - A certified copy of the member''s ID document


    Submit the claim as soon as possible and no later than 3 months after the end of the waiting period.
    The claim can be sent by the employer or broker through the Kestrel Broker Portal, or emailed to claims@kestrel-assurance.example.
    Kestrel aims to make a decision on group life claims within 10 working days of receiving all required
    documents; disability claims may take longer because medical information may need to be obtained.


    Caveats: These are the documents listed for a disability claim in the Kestrel Claims FAQ (2026-03
    edition); the claims team may ask for more information on an individual claim.'
