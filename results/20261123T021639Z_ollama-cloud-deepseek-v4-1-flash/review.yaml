- id: Q3
  question: What is the group life free cover limit for a scheme with 320 members?
  outcome: answered
  answer: 'For a scheme with 320 members, the group life free cover limit is R 5 000 000 (Band 4, which
    covers schemes with 250 to 499 members).


    This means members are covered without medical evidence up to R 5 000 000; cover above that limit
    requires medical evidence and is subject to underwriting acceptance. The limit applies only to members
    who are actively at work when cover starts, and it is set at scheme inception and reviewed at each
    annual review date based on the number of members at that date.


    Caveats: The member count used is the number at the annual review date, so a scheme that grows or
    shrinks may move to a different band at its next review.'
