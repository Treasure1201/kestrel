- id: Q9
  question: Is there a waiting period on extended family funeral cover?
  outcome: answered
  answer: Yes, but only for natural causes. For extended family members there is a 6-month waiting period
    on death from natural causes; death from accidental causes is covered immediately. There is no waiting
    period for the main member, spouse and children.
