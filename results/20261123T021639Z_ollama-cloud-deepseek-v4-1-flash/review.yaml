- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The disability income benefit is paid monthly in arrears until the earliest of these three
    events: the member recovers, the member dies, or the member reaches age 65. So the maximum payment
    age is 65 — but payment stops earlier if the member recovers or dies first.


    Caveats: The payment term applies to the Group Disability Income Benefit (2026 edition of the guide).
    Separate rules apply to group life cover, where cover ends at the scheme''s normal retirement age,
    or age 65 at the latest.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 3 "Payment term"
