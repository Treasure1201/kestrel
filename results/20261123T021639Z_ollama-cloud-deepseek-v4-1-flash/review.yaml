- id: Q12
  question: Within what period must a member's death be notified to Kestrel?
  outcome: answered
  answer: 'Under the group life cover, the death of a member must be notified to Kestrel within 6 months
    of the date of death. Claims notified later may be declined. Once notified, the claim documents still
    have to be sent in — the Claims FAQ lists a completed death claim form, a certified copy of the death
    certificate, a certified copy of the deceased member''s ID document, and a certified copy of each
    beneficiary''s ID document plus a bank confirmation letter.


    Related points for the caller:

    • Decision time: Kestrel aims to make a decision on group life claims within 10 working days of receiving
    all required documents.

    • Funeral claims: the funeral rules state that funeral claims are paid within 48 hours of Kestrel
    receiving all the required documents. The documents shown do not state a separate notification period
    for funeral claims, so the 6-month period above is the notification period given.


    Caveats: The 6-month period comes from the Group Life Product Guide (2026 edition). The funeral rules
    shown set a 48-hour payment period from receipt of complete documents but do not state a notification
    period for funeral claims.'
  sources:
