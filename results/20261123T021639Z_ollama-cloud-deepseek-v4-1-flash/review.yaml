- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: The application must be received within 60 days of leaving service, and cover under the continuation
    option is limited to the lower of the member's group cover and R5 000 000. This applies to a member
    who leaves the employer's service before normal retirement age, and the cover continues on an individual
    Kestrel policy without providing medical evidence.
