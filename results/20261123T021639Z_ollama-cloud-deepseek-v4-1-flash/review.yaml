- id: Q15
  question: How long does Kestrel take to make a decision on a group life claim?
  outcome: answered
  answer: 'Kestrel aims to make a decision on group life claims within 10 working days of receiving all
    required documents. The 10 days only start once all the required documents are in, so the count does
    not begin on the date the claim is first notified. Disability claims may take longer because medical
    information may need to be obtained, and funeral claims are paid within 48 hours of receiving complete
    documents. Separately, the death of a member must be notified to Kestrel within 6 months of the date
    of death — claims notified later may be declined. This is the general rule only; the claims team decides
    each individual claim.


    Caveats: The 10 working days is a target Kestrel ''aims to'' meet, not a guaranteed deadline.'
  sources:
