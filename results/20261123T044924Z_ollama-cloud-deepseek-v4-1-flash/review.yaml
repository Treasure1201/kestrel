- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The disability income benefit is paid monthly in arrears until the earliest of the member''s
    recovery, the member''s death, or the member reaching age 65 — so age 65 is the latest, and it stops
    sooner on recovery or death.


    Caveats: This is from the 2026 edition of the Group Disability Income Guide.'
