  question: What is the maximum lump sum group life cover a member can have?
  outcome: answered
  answer: 'The maximum lump sum group life cover per member is R25 000 000, regardless of salary or multiple.
    This is the maximum cover amount; it is not the same as the free cover limit, which is the amount
    covered without medical evidence and depends on the size band of the scheme.


    Caveats: The free cover limit in the 2026 table is a separate limit (up to R10 000 000 for schemes
