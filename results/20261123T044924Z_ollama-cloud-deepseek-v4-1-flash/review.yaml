- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'The application to continue life cover must be received within 60 days of leaving service.
    Cover under the continuation option is limited to the lower of the member''s group cover and R5 000
    000, and no medical evidence is required. This is the group life continuation option — the member
    applies for an individual Kestrel policy.


    Caveats: The documents describe the continuation option for life cover only; the excerpts shown do
    not state a continuation option for disability income or funeral cover.'
