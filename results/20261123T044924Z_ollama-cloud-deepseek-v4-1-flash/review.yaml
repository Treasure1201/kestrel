- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a disability claim you need: a completed Kestrel disability claim form (with both the employer
    section and the member section), a medical report from the treating doctor, the member''s last 3 payslips,
    and a certified copy of the member''s ID document.


    Claims can be submitted by the employer or broker through the Kestrel Broker Portal, or by email to
    claims@kestrel-assurance.example, and should be submitted no later than 3 months after the end of
    the waiting period. Disability claims may take longer than the 10 working day target for group life
    claims, because medical information may need to be obtained.


    Caveats: The 10 working day decision target applies to group life claims; disability claims may take
    longer.'
  sources:
