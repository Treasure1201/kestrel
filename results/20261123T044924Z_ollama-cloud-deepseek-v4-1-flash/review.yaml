- id: Q3
  question: What is the group life free cover limit for a scheme with 320 members?
  outcome: answered
  answer: 'For a scheme with 320 members, the group life free cover limit is R5 000 000. That is Band
    4, which covers 250 to 499 members; the limit is set at scheme inception and reviewed at each annual
    review date based on the number of members at that date, and free cover limits apply only to members
    who are actively at work when cover starts. Cover above the free cover limit requires medical evidence
    and is subject to underwriting acceptance.


    Caveats: The limit given is for the 2026 edition of the free cover limit schedule.'
