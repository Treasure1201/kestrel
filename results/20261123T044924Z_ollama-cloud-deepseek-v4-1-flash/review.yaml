- id: Q4
  question: A scheme has 1 200 members. What is the disability income free cover limit?
  outcome: answered
  answer: 'For a scheme with 1 200 members, the scheme falls in Band 6 (1 000 members or more), so the
    disability income free cover limit is R 120 000 per month. This applies only to members who are actively
    at work when cover starts, and any cover above the free cover limit requires medical evidence and
    is subject to underwriting acceptance.


