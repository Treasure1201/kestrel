- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C the member would get R42 500 a month: 100% of the first R20 000 of monthly salary,
    plus 75% of the remaining R30 000. That is well under the R300 000 maximum monthly benefit, and salary
    means the member''s monthly pensionable salary on the date disability started. This illustrates the
    general rule only — the claims team decides actual claims.


    Caveats: Uses monthly pensionable salary at the date disability started, so the figure applies only
