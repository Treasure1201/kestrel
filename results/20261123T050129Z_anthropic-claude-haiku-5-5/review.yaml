- id: Q107
  question: A member on disability Option C earned R80 000 a month. What monthly benefit would they get?
  outcome: answered
  answer: 'Under Option C, the monthly benefit is 100% of the first R20 000 of monthly salary plus 75%
    of the balance, capped at a maximum monthly benefit of R300 000. On a monthly salary of R80 000 this
    works out to R65 000 a month (R20 000 + 75% of R60 000). This is an illustration of the general rule,
    and the claims team decides individual cases.


    Caveats: The documents define salary as monthly pensionable salary at the date disability started;
    the R80 000 figure is treated as that salary. Benefit for a real member depends on their case, which
    the claims team decides.'
  sources:
