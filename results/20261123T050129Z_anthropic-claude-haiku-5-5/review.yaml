- id: Q105
  question: For a scheme with 75 members, what are the group life and the disability income free cover
    limits?
  outcome: answered
  answer: 'For a scheme with 75 members (band 2, 50 to 99 members), the group life free cover limit is
    R 2 000 000 and the disability income free cover limit is R 40 000 per month. These limits are set
    at scheme inception and reviewed at each annual review date based on the number of members at that
    date. Cover above these limits requires medical evidence and is subject to underwriting acceptance.


    Caveats: The limits come from the 2026 edition of the free cover limits table; no other edition was
