- id: Q108
  question: What paperwork has to be sent in for a death claim?
  outcome: answered
  answer: 'For a death claim, send in: the completed Kestrel death claim form, a certified copy of the
    death certificate, a certified copy of the deceased member''s ID document, and a certified copy of
    each beneficiary''s ID document plus a bank confirmation letter. The claim can be submitted by the
    employer or broker through the Kestrel Broker Portal or by email to claims@kestrel-assurance.example.
    The death must be notified to Kestrel within 6 months of the date of death, or the claim may be declined.


    Caveats: The documents do not say whether the 6-month notification limit applies to funeral cover
    as well as group life; the Group Life guide states it for member deaths.'
  sources:
