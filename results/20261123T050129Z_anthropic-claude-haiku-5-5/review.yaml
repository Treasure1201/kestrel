- id: Q109
  question: When does a disability income benefit stop being paid?
  outcome: answered
  answer: 'The Kestrel group disability income benefit is paid monthly in arrears until the earliest of
    three events: the member recovers, the member dies, or the member reaches age 65. Whichever of these
    happens first ends the benefit.


    Caveats: The excerpts do not say how a benefit is handled if the member returns to work in a reduced
    capacity beyond the partial disability rule; the claims team decides individual cases.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 3 "Payment term"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
