- id: Q110
  question: How long does someone who leaves their employer have to apply to keep their life cover, and
    do they need medical evidence?
  outcome: answered
  answer: 'A member who leaves the employer before normal retirement age can apply to continue their life
    cover on an individual Kestrel policy within 60 days of leaving service. No medical evidence is needed
    for this continuation option. Cover under this option is limited to the lower of the member''s group
    cover and R5 000 000.


    Caveats: The continuation rule applies to members who leave before normal retirement age. The documents
    do not say whether a longer period applies in other cases.'
  sources:
  - KA_Group_Life_Product_Guide_2026.docx, section 4 "Continuation option"
