- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The disability income benefit is paid monthly in arrears until the earliest of three things:
    the member recovers, the member dies, or the member reaches age 65. So age 65 is the latest it can
    be paid.'
