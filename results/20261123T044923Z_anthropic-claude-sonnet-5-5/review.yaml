  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'Under the group life continuation option, the member''s application must be received within
    60 days of leaving service. Cover is limited to the lower of their group cover and R5 000 000. This
    applies to a member who leaves before normal retirement age, and no medical evidence is needed.


    Caveats: This is the group life continuation option; the documents shown do not describe a continuation
