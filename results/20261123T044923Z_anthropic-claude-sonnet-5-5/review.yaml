- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a monthly salary of R50 000 gives a monthly benefit of R42 500. This is 100%
    of the first R20 000 plus 75% of the remaining R30 000. It is below the Option C maximum of R300 000
    a month. This is an example of the general rule, not a decision on any individual member''s claim.


    Caveats: Salary here means monthly pensionable salary at the date disability started. The 3-month
    waiting period for Option C applies before the benefit is paid.'
