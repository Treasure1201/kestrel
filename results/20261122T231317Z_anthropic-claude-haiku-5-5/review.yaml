- id: Q10
  question: How many extended family members can be added to funeral cover, and what is the maximum entry
    age?
  outcome: answered
  answer: A member can add up to 8 extended family members to funeral cover, such as parents, parents-in-law,
    siblings and grandparents. The maximum entry age for extended family members is 85. Each extended
    family member is optional and has a cover amount of R10 000 each. Extended family cover is paid for
    by the member through payroll deduction. For death from natural causes, a 6-month waiting period applies
    to extended family members; death from accidental causes is covered immediately.
