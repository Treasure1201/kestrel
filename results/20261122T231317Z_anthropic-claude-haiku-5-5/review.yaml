- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The disability income benefit is paid monthly in arrears until the earliest of three events:
    the member recovers, the member dies, or the member reaches age 65. So the benefit normally stops
    at age 65, or earlier if the member recovers or dies first.


    Caveats: This is the 2026 Group Disability Income Guide, the current edition. The documents do not
    address whether a different arrangement applies to a specific scheme; check with the broker or scheme
    administrator for scheme-specific terms.'
