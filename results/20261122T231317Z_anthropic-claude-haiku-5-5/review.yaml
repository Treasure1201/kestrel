- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would receive R42 500 a month. This is 100%
    of the first R20 000 of monthly salary (R20 000), plus 75% of the balance (75% of R30 000 = R22 500).
    The benefit is subject to the Option C maximum of R300 000 a month, which this amount is below. This
    is an illustration of the general rule; the claims team decides individual cases. Option C has a 3-month
    waiting period and annual escalation of a fixed 5%.


    Caveats: This is a general illustration based on the 2026 Group Disability Income Guide; it assumes
    the salary is the monthly pensionable salary at the date disability started, and the documents do
    not show any other deductions.'
