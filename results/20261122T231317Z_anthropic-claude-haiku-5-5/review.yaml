  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'A member who leaves the employer''s service before normal retirement age has 60 days from leaving
    service to apply to continue their life cover on an individual Kestrel policy, without medical evidence.
    The cover under this option is limited to the lower of the member''s group cover and R5 000 000.


    Caveats: The documents do not say whether the 60 days runs from the leaving date or from a notice
    date beyond what is stated; the wording used is ''within 60 days of leaving service''. The rule is
