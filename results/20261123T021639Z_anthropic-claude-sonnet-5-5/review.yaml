  question: What is the maximum lump sum group life cover a member can have?
  outcome: answered
  answer: 'The most lump sum group life cover a member can have is R25 000 000, whatever their salary
    or cover multiple. The employer picks a multiple of annual pensionable salary between 1x and 5x, in
    whole multiples. The same multiple applies to all members in a category.


    Caveats: Separate free cover limits depend on scheme size. They are a different limit from this maximum.
