  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member with a monthly salary of R50 000 would get R42 500 a month under the
    general rule. That is 100% of the first R20 000 (R20 000) plus 75% of the remaining R30 000 (R22 500).
