- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'For group life cover, a member who leaves the employer''s service before normal retirement
    age has 60 days from leaving service for Kestrel to receive their application to continue cover on
    an individual policy. No medical evidence is needed. Continued cover is limited to the lower of the
    member''s group cover and R5 000 000.


    Caveats: This is the general rule for the group life continuation option. The documents shown do not
    give a continuation option for disability income or funeral cover. The claims or underwriting team
    decides individual cases.'
