- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'A disability claim needs these documents: the completed Kestrel disability claim form, with
    both the employer section and the member section filled in; a medical report from the treating doctor;
    the member''s last 3 payslips; and a certified copy of the member''s ID document. The employer or
    broker can submit the claim through the Kestrel Broker Portal, or by email to claims@kestrel-assurance.example.
    Submit it as soon as possible, and no later than 3 months after the end of the waiting period.


    Caveats: Kestrel''s claims team decides individual claims.'
