- id: Q3
  question: What is the group life free cover limit for a scheme with 320 members?
  outcome: answered
  answer: 'A scheme with 320 members falls in Band 4 (250 to 499 members), so the group life free cover
    limit is R5 000 000. That means members are covered without medical evidence up to R5 000 000; cover
    above that limit needs medical evidence and is subject to underwriting acceptance.


    Worth noting for the caller: the free cover limit is set at scheme inception and reviewed at each
    annual review date based on the number of members at that date, and free cover limits apply only to
    members who are actively at work when cover starts.


    Caveats: The limit applies as at the number of members on the relevant date (inception or each annual
    review date); a later change in member numbers can move the scheme to another band.'
