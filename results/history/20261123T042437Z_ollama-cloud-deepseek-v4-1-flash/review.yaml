- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a disability claim the documents needed are: a completed Kestrel disability claim form
    (with both the employer section and the member section), a medical report from the treating doctor,
    the member''s last 3 payslips, and a certified copy of the member''s ID document.


    Also worth telling the caller:

    - Submit the claim as soon as possible and no later than 3 months after the end of the waiting period.

    - The claim can be sent by the employer or broker through the Kestrel Broker Portal, or by email to
    claims@kestrel-assurance.example. Disability claims may take longer than group life claims to assess,
    because medical information may need to be obtained.


    Caveats: This list is for disability claims only; a death claim needs a different set of documents
    (death claim form, death certificate, ID documents and a bank confirmation letter).'
