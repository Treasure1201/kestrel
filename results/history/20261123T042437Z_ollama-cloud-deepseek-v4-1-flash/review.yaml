- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'A member who leaves the employer''s service before normal retirement age may apply to continue
    their life cover on an individual Kestrel policy without providing medical evidence. The application
    must be received within 60 days of leaving service. The cover available under the continuation option
    is limited to the lower of the member''s group cover and R5 000 000.


    Caveats: The documents show this continuation option for group life cover only; they do not state
    a continuation option for disability income or funeral cover. Because the limit is the lower of the
    member''s group cover and R5 000 000, the actual amount depends on that member''s group cover — the
    scheme administrator can confirm it.'
  sources:
