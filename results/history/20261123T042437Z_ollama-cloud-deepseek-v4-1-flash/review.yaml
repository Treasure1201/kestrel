- id: Q4
  question: A scheme has 1 200 members. What is the disability income free cover limit?
  outcome: answered
  answer: 'For a scheme with 1 200 members the disability income free cover limit is R120 000 per month
    (Band 6, which covers schemes with 1 000 members and above).


    That is the amount members are covered for without medical evidence. Points to keep in mind:

    - The limit is set at scheme inception and reviewed at each annual review date, based on the number
    of members at that date — so the band is worked out on the member count at that date, not on any other
    figure.

    - Free cover limits apply only to members who are actively at work when cover starts.

    - Disability income cover above the free cover limit carries a 12-month pre-existing condition exclusion
    for conditions for which the member received treatment or advice in the 12 months before cover started.

    - Schemes with fewer than 10 members have no free cover limit and are fully underwritten.


    Caveats: The limit comes from the 2026 free cover limit schedule, which is marked effective 1 January
    2026; an older schedule may have applied before that date. The member count used must be the number
    at inception or the latest annual review date.'
  sources:
