- id: Q5
  question: What waiting period applies to disability income Option B?
  outcome: answered
  answer: 'Under Option B, the waiting period is 6 months. The benefit is paid after a waiting period
    has been completed, and a claim should be submitted as soon as possible and no later than 3 months
    after the end of the waiting period.


    For comparison, Option A and Option C both have a 3-month waiting period, so the agent should check
