- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The Group Disability Income benefit is paid monthly in arrears until the member reaches age
    65 — but it stops earlier if the member recovers or dies before then. So the end point is the earliest
    of those three events: recovery, death, or age 65. The benefit only starts after the waiting period
    for the option chosen has been completed (3 months for Options A and C, 6 months for Option B).'
