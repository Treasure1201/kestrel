- id: Q9
  question: Is there a waiting period on extended family funeral cover?
  outcome: answered
  answer: 'Yes. For extended family members there is a 6-month waiting period that applies to death from
    natural causes. Death from accidental causes is covered immediately. There is no waiting period for
    the main member, spouse and children.


    Caveats: The 6-month waiting period applies only to death from natural causes; accidental death is
    covered immediately.'
