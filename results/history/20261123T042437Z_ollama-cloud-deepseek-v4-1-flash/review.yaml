- id: Q15
  question: How long does Kestrel take to make a decision on a group life claim?
  outcome: answered
  answer: 'Kestrel aims to make a decision on group life claims within 10 working days of receiving all
    the required documents. This is a target, not a guarantee, and the 10 working days only start once
    all required documents are in. For comparison: disability claims may take longer because medical information
    may need to be obtained, and funeral claims are paid within 48 hours of receiving complete documents.


    Caveats: The 10 working days is an aim, not a fixed deadline, and only starts once all required documents
    have been received.'
