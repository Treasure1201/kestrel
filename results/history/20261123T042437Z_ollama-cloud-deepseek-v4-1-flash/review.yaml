- id: Q12
  question: Within what period must a member's death be notified to Kestrel?
  outcome: answered
  answer: 'A member''s death must be notified to Kestrel within 6 months of the date of death. Claims
    notified later may be declined. The claims FAQ lists what is needed for a death claim: a completed
    Kestrel death claim form, a certified copy of the death certificate, a certified copy of the deceased
    member''s ID document, and a certified copy of each beneficiary''s ID document plus a bank confirmation
    letter.


    Caveats: The 6-month period is stated in the Group Life Assurance Product Guide; the Group Funeral
    Benefit Rules do not state a separate notification deadline.'
