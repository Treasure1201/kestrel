- id: Q1
  question: What is the maximum lump sum group life cover a member can have?
  outcome: answered
  answer: 'The maximum lump sum group life cover per member is R25 000 000. That is the overall maximum,
    whatever the member''s salary and whatever multiple of salary the scheme uses.


    Caveats: Do not confuse this with the free cover limit, which is a different, lower figure that depends
    on how many members are in the scheme: it is R 1 000 000 for schemes of 10 to 49 members and R 10
    000 000 for schemes of 1000 members and above.'
