- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C the monthly benefit would be R42 500, before any limits. Option C pays 100%
    of the first R20 000 of monthly salary plus 75% of the balance. On a salary of R50 000 a month: R20
    000 + 75% of R30 000 = R42 500, which is below Option C''s maximum monthly benefit of R300 000, so
    no cap applies.


    The conditions: this applies once the member has been unable to perform their own occupation because
    of illness or injury and has completed the 3-month waiting period for Option C. The salary used is
    the member''s monthly pensionable salary at the date disability started — so this figure assumes the
    full R50 000 is pensionable salary. Option C also escalates at a fixed 5% a year. This illustrates
    the general rule; the claims team decides individual claims.


    Caveats: Assumes the full R50 000 a month is pensionable salary, since the formula uses monthly pensionable
    salary. The figure is the benefit before any proportionate reduction for partial disability if the
    member returns to work at a lower salary.'
  sources:
