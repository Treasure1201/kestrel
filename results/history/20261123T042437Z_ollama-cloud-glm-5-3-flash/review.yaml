- id: Q10
  question: How many extended family members can be added to funeral cover, and what is the maximum entry
    age?
  outcome: answered
  answer: 'Under the Kestrel Group Funeral Benefit, a member may add up to 8 extended family members (such
    as parents, parents-in-law, siblings and grandparents), and the maximum entry age for extended family
    members is 85. Each extended family member is covered for R10 000, it is paid for by the member through
    payroll deduction, and a 6-month waiting period applies to death from natural causes (death from accidental
    causes is covered immediately).


    Caveats: The maximum entry age of 85 applies to extended family members under the 2026 Funeral Benefit
    Rules; the group life product guide sets a maximum entry age of 64 for members, which is a different
