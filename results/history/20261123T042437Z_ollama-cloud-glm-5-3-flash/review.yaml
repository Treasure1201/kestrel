  question: A scheme has 1 200 members. What is the disability income free cover limit?
  outcome: answered
  answer: For a scheme of 1 200 members the disability income free cover limit is R120 000 per month.
    This is the Band 6 limit, which applies to schemes with 1 000 members and above. Members are covered
