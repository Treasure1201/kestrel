- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a disability income claim, submit: a completed Kestrel disability claim form (employer
    section and member section), a medical report from the treating doctor, the member''s last 3 payslips,
    and a certified copy of the member''s ID document. Submit the claim as soon as possible and no later
    than 3 months after the end of the waiting period. Claims are submitted by the employer or broker
    via the Kestrel Broker Portal or by email to claims@kestrel-assurance.example. Note that disability
    claims may take longer to assess than group life claims because medical information may need to be
    obtained.


    Caveats: The document list comes from the Kestrel Claims FAQ, edition 2026-03; the claim deadline
