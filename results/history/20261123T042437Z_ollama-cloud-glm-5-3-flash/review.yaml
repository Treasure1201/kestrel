- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: The disability income benefit is paid monthly until the earliest of the member's recovery, the
    member's death, or the member reaching age 65. So age 65 is the maximum age, and payment stops earlier
    if the member recovers or dies first. This is from the 2026 edition of the Kestrel Group Disability
    Income Guide and applies across the benefit options.
