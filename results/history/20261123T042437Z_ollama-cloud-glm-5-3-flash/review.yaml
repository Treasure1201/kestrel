- id: Q15
  question: How long does Kestrel take to make a decision on a group life claim?
  outcome: answered
  answer: 'Kestrel aims to make a decision on group life claims within 10 working days of receiving all
    the required documents. This is a target ("aims to"), not a guarantee, and the 10 working days only
    start once the complete set of documents is in. For context, other products are handled differently:
    disability income claims may take longer because medical information may still need to be obtained,
    and funeral claims are paid within 48 hours of receiving complete documents. The claims team can confirm
    where a specific claim stands.


    Caveats: The 10 working days is a stated aim, not a strict deadline, and it runs from receipt of all
    required documents, not from first notification of the claim.'
