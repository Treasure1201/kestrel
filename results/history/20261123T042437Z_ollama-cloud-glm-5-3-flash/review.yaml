- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would receive a monthly benefit of R42 500.
    Option C pays 100% of the first R20 000 of monthly salary plus 75% of the balance: R20 000 + 75% of
    the remaining R30 000 (R22 500) = R42 500. This is below the Option C maximum monthly benefit of R300
    000, so the cap does not reduce it. The benefit is based on the member''s monthly pensionable salary
    at the date disability started, is subject to the Option C 3-month waiting period, and the actual
    amount for any member is determined by the claims and underwriting teams.


    Caveats: Assumes the full R50 000 is monthly pensionable salary; the rules base the benefit on monthly
    pensionable salary at the date disability started. This is an illustrative calculation of the general
    rule, not a determination for a specific member. Benefit payable only after the 3-month waiting period,
    and the claim itself is decided by the claims and underwriting teams.'
  sources:
