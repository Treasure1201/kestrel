- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'Under the 2026 Group Life Product Guide, the member must get their continuation application
    to Kestrel within 60 days of leaving service. If they left before normal retirement age, life cover
    can then continue on an individual Kestrel policy without medical evidence. The cover allowed is limited
    to the lower of the member''s group cover and R5 000 000. So the member''s actual continuation cover
    is whichever is smaller: the group cover they held, up to a maximum of R5 000 000. Underwriting can
    help if more cover than this is wanted.


    Caveats: The deadline is strict: the application must be received (not just sent) within 60 days of
    leaving service. The continuation option applies to life cover; the documents shown do not describe
    a similar continuation option for disability income or funeral cover.'
  sources:
  - KA_Group_Life_Product_Guide_2026.docx, section 4 "Continuation option"
