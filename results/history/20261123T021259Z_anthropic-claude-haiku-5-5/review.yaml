- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would receive R42 500 a month. This is 100%
    of the first R20 000 of monthly salary, plus 75% of the balance (R30 000). The benefit is capped at
    a maximum of R300 000 a month, so this amount is within the cap. Option C has a 3-month waiting period
    and fixed 5% annual escalation. This is an illustration of the general rule, not a decision on any
    individual claim.


    Caveats: The figure assumes R50 000 is the member''s monthly pensionable salary at the date disability
    started. The documents do not say whether any other deduction or adjustment applies.'
