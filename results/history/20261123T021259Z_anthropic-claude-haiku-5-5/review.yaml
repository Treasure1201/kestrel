- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'To submit a disability claim, Kestrel needs these documents: a completed Kestrel disability
    claim form (with the employer section and the member section completed), a medical report from the
    treating doctor, the member''s last 3 payslips, and a certified copy of the member''s ID document.
    The claim should be submitted as soon as possible and no later than 3 months after the end of the
    waiting period. Claims can be sent by the employer or broker through the Kestrel Broker Portal, or
    by email to claims@kestrel-assurance.example. Disability claims may take longer than life claims because
    medical information may need to be obtained.


    Caveats: The 3-month submission limit comes from the Group Disability Income Guide 2026; the claims
    FAQ (edition 2026-03) does not repeat it. The documents do not say what happens if the 3-month limit
    is missed; the claims team decides individual cases.'
