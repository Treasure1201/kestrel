- id: Q10
  question: How many extended family members can be added to funeral cover, and what is the maximum entry
    age?
  outcome: answered
  answer: 'A member can add up to 8 extended family members to funeral cover, such as parents, parents-in-law,
    siblings and grandparents. The maximum entry age for extended family members is 85. Each extended
    family member is insured for R10 000 and the cover is optional and paid for by the member through
    payroll deduction. Extended family members have a 6-month waiting period for death from natural causes;
    accidental deaths are covered immediately.


    Caveats: The entry age of 85 is from the 2026 Funeral Benefit Rules. The Group Life Product Guide
