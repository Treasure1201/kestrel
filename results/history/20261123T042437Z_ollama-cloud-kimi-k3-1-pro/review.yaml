- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: Under the current 2026 guide, the disability income benefit is paid monthly in arrears until
    the earliest of the member’s recovery, the member’s death, or the member reaching age 65. Payments
    can therefore stop before age 65 if the member recovers or dies.
