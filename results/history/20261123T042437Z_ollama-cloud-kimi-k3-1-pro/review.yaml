  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, the monthly benefit is **R42 500**, using R50 000 as the member’s monthly pensionable
    salary at the date disability started.


    The calculation is 100% of the first R20 000, plus 75% of the remaining R30 000: R20 000 + R22 500
