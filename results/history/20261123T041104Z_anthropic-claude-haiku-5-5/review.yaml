- id: Q10
  question: How many extended family members can be added to funeral cover, and what is the maximum entry
    age?
  outcome: answered
  answer: 'A member can add up to 8 extended family members, such as parents, parents-in-law, siblings
    and grandparents. The maximum entry age for extended family members is 85. Each extended family member
    (optional) has cover of R10 000. Extended family cover is paid for by the member through payroll deduction.
    Note that a 6-month waiting period applies to death from natural causes for extended family members;
    accidental death is covered immediately.


    Caveats: The funeral benefit rules give an entry age of 85 for extended family members. Do not use
    the group life entry age for this cover.'
