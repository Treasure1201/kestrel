- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The Kestrel Group Disability Income Benefit is paid monthly in arrears until the earliest of
    three events: the member recovers, the member dies, or the member reaches age 65. So the benefit is
    paid up to age 65, unless it ends earlier because of recovery or death.


    Caveats: The documents do not say whether the age 65 limit differs for any other scheme terms; the
    broker or scheme administrator can confirm scheme-specific terms.'
