- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'To submit a disability claim, the Kestrel claims FAQ lists these documents: a completed Kestrel
    disability claim form (with both the employer section and the member section), a medical report from
    the treating doctor, the member''s last 3 payslips, and a certified copy of the member''s ID document.
    Claims can be submitted by the employer or broker through the Kestrel Broker Portal, or by email to
    claims@kestrel-assurance.example. Claims should be submitted as soon as possible and no later than
    3 months after the end of the waiting period. Disability claims may take longer to assess because
    medical information may need to be obtained.


    Caveats: The documents do not say whether any other documents are needed in particular cases; the
    claims team can confirm the full list for a specific claim.'
