  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would receive R42 500 a month. This is 100%
    of the first R20 000 of monthly salary, plus 75% of the balance (R30 000). The benefit is well under
    the R300 000 monthly maximum, and the waiting period is 3 months. This is a general illustration of
    the rule, not a decision on any individual member''s claim; the claims team decides individual cases.


