- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a disability claim, Kestrel needs a completed Kestrel disability claim form (with both
    the employer section and the member section filled in), a medical report from the treating doctor,
    the member''s last 3 payslips, and a certified copy of the member''s ID document. Claims can be sent
    through the Kestrel Broker Portal or by email to claims@kestrel-assurance.example. Claims should be
    submitted as soon as possible and no later than 3 months after the end of the waiting period.


    Caveats: The documents do not say whether any other documents may be requested case by case. The claims
    team decides individual claims.'
