- id: Q3
  question: What is the group life free cover limit for a scheme with 320 members?
  outcome: answered
  answer: 'A scheme with 320 members falls in Band 4 (250 to 499 members), so the group life free cover
    limit is R 5 000 000.


    Members are covered without medical evidence up to this limit, provided they are actively at work
    when cover starts. Cover above the limit requires medical evidence and is subject to underwriting
    acceptance. The limit is set at scheme inception and reviewed at each annual review date, based on
    the number of members at that date.'
