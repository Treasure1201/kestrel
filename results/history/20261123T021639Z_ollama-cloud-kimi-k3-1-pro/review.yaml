- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: A member who leaves the employer’s service before normal retirement age can apply to continue
    their life cover on an individual Kestrel policy without providing medical evidence. The application
    must be received within 60 days of leaving service, and the continuation cover is limited to the lower
    of the member’s group cover and R5 000 000.
