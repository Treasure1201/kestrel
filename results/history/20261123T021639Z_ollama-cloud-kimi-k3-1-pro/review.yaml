- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'For illustration, an Option C member with a monthly pensionable salary of R50 000 would have
    a calculated monthly benefit of R42 500. This is R20 000 plus R22 500, being 75% of the remaining
    R30 000, and is below the R300 000 maximum monthly benefit.


    Option C has a 3-month waiting period and fixed 5% annual escalation. Salary means the member’s monthly
    pensionable salary at the date disability started. The benefit is paid monthly in arrears until the
    earliest of recovery, death or reaching age 65.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 2 "Benefit options", table 1
