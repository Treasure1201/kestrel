- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'The member has 60 days from leaving service to get their application to Kestrel. Cover can
    be up to the lower of their group cover and R5 000 000. This applies to group life cover, and only
    if they leave before normal retirement age. No medical evidence is needed.


    Caveats: This is the general rule from the 2026 Group Life Product Guide. It does not decide any individual
    member''s case.'
