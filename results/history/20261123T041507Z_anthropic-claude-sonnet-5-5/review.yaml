  question: What is the maximum lump sum group life cover a member can have?
  outcome: answered
  answer: 'The most lump sum group life cover one member can have is R25 000 000, whatever their salary
    or cover multiple. Cover above a scheme''s free cover limit is a separate matter (see caveats).


    Caveats: The free cover limits table sets different amounts by scheme size, from R1 000 000 to R10
