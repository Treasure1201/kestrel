- id: Q9
  question: Is there a waiting period on extended family funeral cover?
  outcome: answered
  answer: 'Yes. Extended family members have a 6-month waiting period for death from natural causes. Death
    from accidental causes is covered immediately. The main member, spouse and children have no waiting
    period.


    Caveats: This is the general rule from the 2026 Funeral Benefit Rules. Whether a particular claim
    is payable is decided by the claims team.'
