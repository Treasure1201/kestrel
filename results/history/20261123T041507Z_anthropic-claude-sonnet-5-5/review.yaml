- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a disability claim you need: the completed Kestrel disability claim form (employer section
    and member section), a medical report from the treating doctor, the member''s last 3 payslips, and
    a certified copy of the member''s ID document. Submit the claim as soon as possible, and no later
    than 3 months after the end of the waiting period. The employer or broker can submit it through the
    Kestrel Broker Portal or by email to claims@kestrel-assurance.example.'
