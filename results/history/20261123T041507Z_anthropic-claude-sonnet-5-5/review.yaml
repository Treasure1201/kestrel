- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member whose monthly salary is R50 000 would get R42 500 a month, as an illustration
    of the general rule. Option C pays 100% of the first R20 000 of monthly salary plus 75% of the balance.
    The maximum monthly benefit is R300 000, and the benefit starts after a 3-month waiting period.


    Caveats: This illustrates the general rule using the figure given. The claims team decides what an
    actual member receives. The R50 000 is treated as monthly pensionable salary at the date disability
    started, which is how the guide defines salary.'
