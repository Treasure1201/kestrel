- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: The disability income benefit is paid monthly, in arrears, for as long as the member is disabled,
    up to age 65 at most. It stops at the earliest of the member's recovery, the member's death, or the
    member reaching age 65.
