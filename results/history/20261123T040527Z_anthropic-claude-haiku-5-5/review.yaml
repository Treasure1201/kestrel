- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would receive R42 500 a month. This is 100%
    of the first R20 000 of salary, plus 75% of the remaining R30 000. This is subject to the Option C
    maximum monthly benefit of R300 000, which this amount is below. The benefit starts after a 3-month
    waiting period. This is an illustration of the general rule; the claims team decides individual claims.


    Caveats: The example uses the 2026 edition of the Group Disability Income Guide, the only edition
    in the documents shown. Salary is the monthly pensionable salary at the date disability started.'
  sources:
