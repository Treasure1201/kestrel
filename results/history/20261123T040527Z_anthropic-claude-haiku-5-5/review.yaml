- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'A member who leaves the employer before normal retirement age can apply to continue their life
    cover on an individual Kestrel policy without providing medical evidence. The application must be
    received within 60 days of leaving service. Cover under the continuation option is limited to the
    lower of the member''s group cover and R5 000 000.


    Caveats: The continuation rule is from the 2026 Group Life Product Guide (current edition). The documents
    do not say how the 60 days is counted beyond ''received within 60 days of leaving service''. Whether
    a specific member qualifies is decided by the claims or underwriting team.'
  sources:
  - KA_Group_Life_Product_Guide_2026.docx, section 4 "Continuation option"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: 60 days, and keeps the condition 'the lower of the group cover and R5 000 000'.
