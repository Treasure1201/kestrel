- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The Kestrel Group Disability Income Benefit is paid monthly in arrears until the earliest of:
    the member''s recovery, the member''s death, or the member reaching age 65. So the benefit is paid
    up to age 65, unless the member recovers or dies earlier.


    Caveats: The answer comes from the 2026 edition of the Group Disability Income Guide, which is the
    current edition in the documents.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 3 "Payment term"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: Age 65, or earlier recovery or death.
