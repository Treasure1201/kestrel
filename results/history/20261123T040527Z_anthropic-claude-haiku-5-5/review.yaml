- id: Q15
  question: How long does Kestrel take to make a decision on a group life claim?
  outcome: answered
  answer: 'Kestrel aims to make a decision on a group life claim within 10 working days of receiving all
    required documents. This is a target, counted from when Kestrel has all the required documents. The
    claim is not decided on this timeline until the documents are complete.


    Caveats: The 10 working days is an aim, not a guaranteed time. The clock starts only once all required
    documents have been received. Disability claims may take longer because medical information may need
    to be obtained, so this timeline does not apply to them. The death must be notified to Kestrel within
    6 months of the date of death, or the claim may be declined (c2).'
  sources:
  - KA_Claims_FAQ.docx, section "How long does it take to assess a claim?"
  - KA_Group_Life_Product_Guide_2026.docx, section 5 "Claims"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: '''Aims to'' decide within 10 working days of receiving all required documents. The hidden
