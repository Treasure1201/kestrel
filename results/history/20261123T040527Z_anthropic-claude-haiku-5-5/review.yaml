  assessment: Correct
  comment: Up to 8 extended family members, maximum entry age 85.
- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'To submit a disability claim, the member needs to provide: a completed Kestrel disability claim
    form (with both the employer section and the member section filled in), a medical report from the
    treating doctor, the member''s last 3 payslips, and a certified copy of the member''s ID document.
    Claims can be sent by the employer or broker through the Kestrel Broker Portal, or by email to claims@kestrel-assurance.example.
    Claims should be submitted as soon as possible and no later than 3 months after the end of the waiting
    period. Disability claims may take longer to assess than group life claims, because medical information
    may need to be obtained.


    Caveats: The documents do not say whether the medical report or the ID copy has any other format requirement
    beyond what is listed. The 3-month submission limit comes from the Group Disability Income Guide;
    the FAQ does not repeat it.'
  sources:
  - KA_Claims_FAQ.docx, section "What documents are needed for a disability claim?"
  - KA_Claims_FAQ.docx, section "How do I submit a claim?"
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 6 "Claims"
  - KA_Claims_FAQ.docx, section "How long does it take to assess a claim?"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: All four documents listed from the claims FAQ.
