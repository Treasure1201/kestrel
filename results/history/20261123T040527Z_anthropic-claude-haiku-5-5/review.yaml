- id: Q9
  question: Is there a waiting period on extended family funeral cover?
  outcome: answered
  answer: 'Yes. Extended family members have a 6-month waiting period for death from natural causes. Death
    from accidental causes is covered immediately. There is no waiting period for the main member, spouse
    and children.


    Caveats: The answer comes from the 2026 edition of the Kestrel Funeral Benefit Rules, which is the
    current edition shown.'
  sources:
  - KA_Funeral_Benefit_Rules_2026.docx, section 4 "Waiting periods"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: 6 months for natural causes; accidental death covered immediately.
- id: Q10
  question: How many extended family members can be added to funeral cover, and what is the maximum entry
    age?
  outcome: answered
  answer: 'A member can add up to 8 extended family members to funeral cover, such as parents, parents-in-law,
    siblings and grandparents. The maximum entry age for extended family members is 85. Each extended
    family member is insured for R10 000, and this cover is optional and paid for by the member through
    payroll deduction. A 6-month waiting period applies to death from natural causes for extended family
    members; death from accidental causes is covered immediately.


    Caveats: The 85 entry age is stated in the Funeral Benefit Rules (2026 edition). The Group Life Product
    Guide sets a different maximum entry age (for group life cover, not funeral cover), so it was not
    used here.'
  sources:
  - KA_Funeral_Benefit_Rules_2026.docx, section 3 "Extended family cover"
  - KA_Funeral_Benefit_Rules_2026.docx, section 2 "Cover amounts", table 1, row 5 (cells row 5)
