- id: Q107
  question: A member on disability Option C earned R80 000 a month. What monthly benefit would they get?
  outcome: answered
  answer: 'For Option C, a member earning R80 000 a month would get R65 000 a month. The benefit is 100%
    of the first R20 000 of monthly salary, plus 75% of the balance (R60 000), and the monthly benefit
    is capped at R300 000. This is a general illustration of the rule; the claims team decides individual
    cases. The waiting period for Option C is 3 months.


    Caveats: The calculation uses R80 000 as the monthly pensionable salary at the date disability started,
