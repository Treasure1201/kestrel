- id: Q108
  question: What paperwork has to be sent in for a death claim?
  outcome: answered
  answer: 'For a death claim, the family needs to send in these documents: a completed Kestrel death claim
    form, a certified copy of the death certificate, a certified copy of the deceased member''s ID document,
    and a certified copy of each beneficiary''s ID document plus a bank confirmation letter. The death
    must be reported to Kestrel within 6 months of the date of death, or the claim may be declined. Once
    Kestrel has all the required documents, group life claims are decided within 10 working days, and
    funeral claims are paid within 48 hours.


    Caveats: The documents list the paperwork but do not say whether the group life or funeral timeframe
    applies to a particular claim; the agent should confirm which cover the deceased had. Whether a late
    notification will be accepted is a decision for the claims team.'
