- id: Q110
  question: How long does someone who leaves their employer have to apply to keep their life cover, and
    do they need medical evidence?
  outcome: answered
  answer: 'A member who leaves the employer before normal retirement age has 60 days from the date they
    leave service to apply to continue their life cover on an individual Kestrel policy. No medical evidence
    is needed for this continuation option. The cover continued is limited to the lower of the member''s
    group cover and R5 000 000.


    Caveats: The 60 days run from leaving service, and the application must be received within that time,
    not just posted. The excerpts do not say what happens after 60 days. This answer is from the 2026
    Group Life Product Guide. The excerpts do not show an earlier edition, so no change is noted. The
    documents do not say whether an individual case qualifies. The claims or underwriting team decides
    individual cases.'
