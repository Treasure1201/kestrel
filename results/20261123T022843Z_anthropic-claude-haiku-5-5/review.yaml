- id: Q109
  question: When does a disability income benefit stop being paid?
  outcome: answered
  answer: 'A Kestrel group disability income benefit is paid monthly in arrears until the earliest of
    these three events: the member recovers, the member dies, or the member reaches age 65. Once any one
    of these happens, the benefit stops. Individual claim decisions are made by the claims team.


    Caveats: The excerpt is from the 2026 edition of the Group Disability Income guide (current). The
    documents do not describe any other stop events, so a benefit may be affected by terms not in these
    excerpts; the claims team should confirm individual cases.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 3 "Payment term"
  auto_grade: correct
