- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under Option C, a member earning R50 000 a month would receive R42 500 a month. This is 100%
    of the first R20 000 of monthly salary, plus 75% of the balance (R30 000), and it is subject to the
    R300 000 monthly maximum, which this amount does not reach. Benefits start after a 3-month waiting
    period. This is an illustration of the general rule; the claims team decides individual cases.


    Caveats: The example assumes R50 000 is the member''s monthly pensionable salary at the date disability
    started. The 2026 guide is the only edition shown.'
  sources:
