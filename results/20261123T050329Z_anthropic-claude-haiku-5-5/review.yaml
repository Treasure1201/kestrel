- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'A member leaving the employer''s service before normal retirement age can apply to continue
    their life cover on an individual Kestrel policy without medical evidence. The application must be
    received within 60 days of leaving service. The cover is limited to the lower of the member''s group
    cover and R5 000 000.


    Caveats: The continuation rule is from the Group Life Product Guide 2026 (current edition). The cover
    is the lower of the member''s group cover and R5 000 000, so a member with less group cover gets less.
    The excerpts do not say whether the 60 days runs from a different date than the leaving date.'
  sources:
  - KA_Group_Life_Product_Guide_2026.docx, section 4 "Continuation option"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: '60 days, and keeps both conditions: before normal retirement age, and the lower of the group
    cover and R5 000 000.'
