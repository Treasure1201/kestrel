- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'For a disability claim, the member needs to provide: a completed Kestrel disability claim form
    (with both the employer section and the member section completed), a medical report from the treating
    doctor, the member''s last 3 payslips, and a certified copy of the member''s ID document. The claim
    should be submitted as soon as possible and no later than 3 months after the end of the waiting period.
    Claims can be sent by the employer or broker through the Kestrel Broker Portal or by email to claims@kestrel-assurance.example.


    Caveats: The documents do not say whether any other documents may be requested for a particular claim;
    the claims team can confirm this for an individual case.'
  sources:
  - KA_Claims_FAQ.docx, section "What documents are needed for a disability claim?"
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 6 "Claims"
  - KA_Claims_FAQ.docx, section "How do I submit a claim?"
  auto_grade: correct
  auto_reasons: 'Auto-grade: correct (automatic check against the gold file, not a human assessment).
    Expected section cited.'
  assessment: Correct
  comment: All four documents listed from the claims FAQ.
