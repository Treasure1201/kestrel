- id: Q6
  question: Under disability Option C, what monthly benefit would a member earning R50 000 a month receive?
  outcome: answered
  answer: 'Under disability Option C, a member earning R50 000 a month would receive R42 500 a month.
    Option C pays 100% of the first R20 000 of monthly salary plus 75% of the balance, which is below
    the R300 000 maximum monthly benefit. Salary means monthly pensionable salary at the date disability
    started, and the benefit is subject to a 3-month waiting period with a fixed 5% annual escalation.
    This is the general rule applied to the example figure; the claims or underwriting team confirms the
    amount for an individual claim.


    Caveats: This illustrates the general rule using the example salary of R50 000; the claims or underwriting
