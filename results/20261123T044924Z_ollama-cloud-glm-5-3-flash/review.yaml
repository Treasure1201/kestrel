  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'The member must apply within 60 days of leaving service (and must have left before normal retirement
    age); no medical evidence is needed. The continuation cover is limited to the lower of the member''s
    group cover and R5 000 000.


