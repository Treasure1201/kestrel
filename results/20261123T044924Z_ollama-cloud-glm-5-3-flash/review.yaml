- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The disability income benefit is paid monthly in arrears until the earliest of three events:
    the member''s recovery, the member''s death, or the member reaching age 65. So age 65 is the latest
    age it runs to, and it stops earlier if the member recovers or dies first.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 3 "Payment term"
