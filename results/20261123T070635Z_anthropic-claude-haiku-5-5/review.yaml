- id: Q10
  question: How many extended family members can be added to funeral cover, and what is the maximum entry
    age?
  outcome: answered
  answer: 'A member may add up to 8 extended family members to funeral cover, such as parents, parents-in-law,
    siblings and grandparents. The maximum entry age for extended family members is 85. Extended family
    cover is optional, costs R10 000 cover for each person, and is paid for by the member through payroll
    deduction. Extended family members have a 6-month waiting period for death from natural causes; death
    from accidental causes is covered immediately.


