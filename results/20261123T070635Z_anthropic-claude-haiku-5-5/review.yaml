- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The disability income benefit is paid monthly in arrears until the earliest of: the member''s
    recovery, the member''s death, or the member reaching age 65. So the benefit stops at age 65 at the
    latest, or earlier if the member recovers or dies first.


    Caveats: The guide covers the Group Disability Income Benefit (2026 edition, current). Individual
    claim decisions are made by the claims team.'
