- id: Q2
  question: A member is leaving their employer. How long do they have to take up the continuation option,
    and up to what amount of cover?
  outcome: answered
  answer: 'A member who leaves the employer''s service before normal retirement age can apply to continue
    their life cover on an individual Kestrel policy without providing medical evidence. The application
    must be received within 60 days of leaving service. Cover under the continuation option is limited
    to the lower of the member''s group cover and R5 000 000.


    Caveats: The continuation rule is from the Group Life Product Guide 2026 (current edition). The documents
    do not say whether the 60 days are calendar or working days.'
