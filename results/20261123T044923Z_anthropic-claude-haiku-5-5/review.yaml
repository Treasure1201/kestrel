- id: Q11
  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'A disability claim needs these documents: a completed Kestrel disability claim form (with both
    the employer section and the member section completed), a medical report from the treating doctor,
    the member''s last 3 payslips, and a certified copy of the member''s ID document. The claim should
    be submitted as soon as possible and no later than 3 months after the end of the waiting period. Claims
    can be sent through the Kestrel Broker Portal or by email to claims@kestrel-assurance.example. Individual
    claims are decided by the claims team.


    Caveats: The documents do not say whether any other documents may be requested for a particular claim;
    the claims team decides individual cases.'
