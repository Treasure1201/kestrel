- id: Q7
  question: Until what age is the disability income benefit paid?
  outcome: answered
  answer: 'The Kestrel Group Disability Income benefit is paid monthly in arrears until the earliest of:
    the member''s recovery, the member''s death, or the member reaching age 65. So the latest it is paid
    is up to age 65, and it stops earlier if the member recovers or dies first.


    Caveats: The answer applies to the 2026 edition of the Group Disability Income Guide, which is the
    current edition in the documents.'
  sources:
  - KA_Group_Disability_Income_Guide_2026.pdf, page 1, section 3 "Payment term"
  auto_grade: correct
