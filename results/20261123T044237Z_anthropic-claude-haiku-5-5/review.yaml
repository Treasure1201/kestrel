  question: What documents are needed to submit a disability claim?
  outcome: answered
  answer: 'To submit a disability claim, the Kestrel Claims FAQ lists these documents: a completed Kestrel
    disability claim form (with the employer section and the member section), a medical report from the
    treating doctor, the member''s last 3 payslips, and a certified copy of the member''s ID document.
