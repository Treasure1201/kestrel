[theme]
base = "light"
primaryColor = "#0F62C4"
backgroundColor = "#F6F9FC"
secondaryBackgroundColor = "#EDF3FA"
textColor = "#14263B"
linkColor = "#0F62C4"
borderColor = "#DCE5EF"
dataframeBorderColor = "#DCE5EF"
dataframeHeaderBackgroundColor = "#E7F0FB"
dataframeHeaderTextColor = "#0B2A4A"
codeBackgroundColor = "#EDF3FA"
codeTextColor = "#0B4F9E"
font = "sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
headingFontWeights = [700, 700, 650, 600, 600, 600]
greenColor = "#0B7A66"
greenTextColor = "#0B7A66"
greenBackgroundColor = "#E2F5F0"
orangeColor = "#B07A12"
orangeTextColor = "#7A4B00"
orangeBackgroundColor = "#FFF3D1"
redColor = "#A1301C"
redTextColor = "#A1301C"
redBackgroundColor = "#FDEBE7"
grayColor = "#5B6B80"
grayTextColor = "#3C4A5C"
grayBackgroundColor = "#EAF0F6"
blueColor = "#0F62C4"
blueTextColor = "#0B4F9E"
blueBackgroundColor = "#E7F0FB"
violetColor = "#5B3BA8"
violetTextColor = "#5B3BA8"
violetBackgroundColor = "#F0EBFB"

[theme.sidebar]
backgroundColor = "#0B2A4A"
secondaryBackgroundColor = "#143A63"
textColor = "#E7F0FB"
primaryColor = "#7DB3F5"
borderColor = "#2A5683"
codeBackgroundColor = "#143A63"
codeTextColor = "#E7F0FB"
grayTextColor = "#D3E1F2"
grayBackgroundColor = "#1D4876"
greenTextColor = "#9EE6D4"
greenBackgroundColor = "#0F4A45"
redTextColor = "#FFC9BD"
redBackgroundColor = "#5A2318"

[server]
# Local only: anyone who can reach the app can spend the configured API key.
address = "localhost"
headless = true

[browser]
gatherUsageStats = false
