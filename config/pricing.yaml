# List prices in USD per million tokens, used to report a measured cost per question.
# Taken from each provider's own pricing page on the date below. Discounts (prompt
# caching, batch, negotiated rates) are not modelled, so a reported cost is an upper
# estimate where caching applies.
#
# Sources:
#   Anthropic     https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI        https://developers.openai.com/api/docs/pricing  (standard tier)
#   Ollama Cloud  https://ollama.com/pricing  (billed per token since 31 August 2026)
#
# A model without an entry is reported with an unknown cost, never a guessed one.
# Local Ollama has no API charge and is always reported as unknown cost.

as_of: 2026-11-23
currency: USD

prices:
  anthropic:
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-haiku-5-5: {input: 0.10, output: 0.50}   # prompts up to 100K tokens; 0.50 / 2.50 beyond
    claude-opus-5-5: {input: 4.00, output: 20.00}
  openai:
    gpt-6.1-sol: {input: 2.00, output: 10.00}       # prompts up to 272K tokens; 4.00 / 15.00 beyond
  ollama-cloud:
    kimi-k3.1-pro: {input: 2.00, output: 10.00}
    deepseek-v4.1-flash: {input: 0.30, output: 1.20}
    glm-5.3-flash: {input: 0.15, output: 0.50}
    "gpt-oss:20b": {input: 0.07, output: 0.30}
