[project]
name = "kestrel"
version = "0.1.0"
description = "Governed, cited question answering over approved documents, organised as configurable bots."
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.41",
    "langchain",
    "langchain-ollama",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-mcp-adapters",
    "mcp",
    "fastembed",
    "sqlite-vec",
    "python-docx",
    "pymupdf",
    "openpyxl",
    "defusedxml",
    "pyyaml",
    "pydantic-settings",
    "python-dotenv",
    "typer",
    "streamlit",
    "httpx",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kestrel = "kestrel.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
    "live: calls a real model provider; skipped unless run with -m live",
    "spike: compatibility spike proving a library works as the design assumes",
]
